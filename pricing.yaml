# Fallback USD rates per 1M tokens, used ONLY when a harness reports neither
# AI Credits nor a cost. Copilot CLI reports AI Credits (1 credit = $0.01);
# Claude Code reports its own estimate. Edit freely; nothing proprietary here.
#
# Source: https://docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing
# as of 2026-09-23. cached_input / cache_write default to the input rate when
# omitted; where GitHub lists only input/output, cached rates below are derived
# (Anthropic: cached 0.1x, write 1.25x input; OpenAI/Google: cached 0.1x input).
